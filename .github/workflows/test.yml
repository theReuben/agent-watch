name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Build & Test
    runs-on: macos-15

    env:
      SCHEME: "AgentWatch Watch App"
      PROJECT: AgentWatch.xcodeproj
      SDK: watchsimulator
      DESTINATION: "platform=watchOS Simulator,name=Apple Watch Series 10 (46mm)"
      XCODE_VERSION: "16.2"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode ${{ env.XCODE_VERSION }}
        run: sudo xcode-select -s /Applications/Xcode_${XCODE_VERSION}.app/Contents/Developer

      - name: Prepare watchOS Simulator
        run: |
          xcodebuild -version
          # Download watchOS simulator runtime (may already be present)
          xcodebuild -downloadPlatform watchOS
          # Determine the latest available watchOS runtime
          RUNTIME=$(xcrun simctl list runtimes -j | python3 -c "
          import sys, json
          rts = [r for r in json.load(sys.stdin)['runtimes']
                 if 'watchOS' in r.get('name','') and r.get('isAvailable')]
          print(rts[-1]['identifier'] if rts else '')
          ")
          if [ -z "$RUNTIME" ]; then
            echo "::error::No watchOS simulator runtime found"
            exit 1
          fi
          echo "Using runtime: $RUNTIME"
          # Create the simulator device used by DESTINATION
          xcrun simctl create 'Apple Watch Series 10 (46mm)' \
            'com.apple.CoreSimulator.SimDeviceType.Apple-Watch-Series-10-46mm' \
            "$RUNTIME" || true
          xcrun simctl list devices watchOS

      - name: Build
        run: |
          set -o pipefail
          xcodebuild build \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -sdk "$SDK" \
            -destination "$DESTINATION" \
            CODE_SIGN_IDENTITY=- \
            AD_HOC_CODE_SIGNING_ALLOWED=YES \
            | xcpretty

      - name: Test
        run: |
          set -o pipefail
          xcodebuild test \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -sdk "$SDK" \
            -destination "$DESTINATION" \
            CODE_SIGN_IDENTITY=- \
            AD_HOC_CODE_SIGNING_ALLOWED=YES \
            -enableCodeCoverage YES \
            -resultBundlePath results.xcresult \
            | xcpretty

      - name: Code coverage summary
        if: always()
        run: |
          if [ -d results.xcresult ]; then
            echo "### Code Coverage" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            xcrun xccov view --report results.xcresult >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || echo "Coverage data unavailable" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: results.xcresult
          if-no-files-found: ignore
          retention-days: 14
